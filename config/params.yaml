# 在线 GNSS 及逐帧去畸变点云记录：用于不依赖 bag 的轨迹优化和地图重建。
# 点云保存为 map_save.path 同目录下的 gnss/scans.bin；其余记录参数使用默认值。
gnss_recorder:
  enable: True
  gnss_topic: "/gnss"

map:
  pixel_size_m: 0.05 # 像素边长 [m]
  voxel_size_m: 0.5 # 体素边长 [m]
  normal_tolerance_deg: 3 # 触发体素图重投影的法向变化阈值 [°]
  smooth: True # 是否对体素图进行平滑
  weighted: True # 是否使用加权像素更新
  max_size: 1500000 # 地图中最多保留的体素数量
  frame: "odom"

preprocess:
  downsample_resolution_m: 0.1 # 点云降采样分辨率 [m]；启用信息采样时对应高分辨率体素
  informed_sampling: True

optimization:
  huber_delta: 0.1 # Huber 鲁棒核阈值

imu:  
    window_s: 10 # 惯性优化时间窗口 [s]
    t_init: 0.2 # 初始化零偏和重力所需时间 [s]
    frame: "imu"

path:
  publish: True # 是否以 nav_msgs/Path 发布累计轨迹
  max_poses: 0 # 轨迹最多保留的位姿数；0 表示不限制，超出后删除最早位姿

map_save: # 此处保存纯里程计地图，不是回环优化地图；回环地图由 bundle_path 保存
  accumulate: True # 是否累计配准后的扫描，供 save_map 服务保存
  resolution_m: 0.1 # 纯里程计累计点云的体素分辨率 [m]
  path: "/home/zsq/slam/bievr-slam/src/BIEVR-LIO/Log/map.pcd" # 纯里程计地图的保存路径

# 在线支柱提取：直接使用 LIO 的去畸变点云和同步位姿，在后台将若干扫描组成
# 带少量重叠的距离/帧数混合关键帧，再执行粗筛和圆柱拟合。
pole_extraction:
  enable: True

  # 距离/帧数混合关键帧：行驶 30m 后触发，低速时最多累计 50 帧。
  frames_per_keyframe: 50 # 最大帧数
  min_frames_per_keyframe: 20 # 距离触发前至少积累的帧数
  keyframe_distance_m: 30.0
  keyframe_overlap_frames: 5 # 复用少量边界帧，减少支柱被窗口切断
  process_partial_keyframe: True # 退出时也处理最后一个未满关键帧
  min_partial_frames: 10
  max_queue: 3 # 提取跟不上时丢弃最老的待处理关键帧，避免阻塞里程计
  input_voxel_resolution_m: 0.10

  # gnss_optimize 输出的 TUM 轨迹可在首次建图回放时填入这里，使支柱地图
  # 位于 ENU/map 坐标系。第二次支柱重定位运行必须留空。
  mapping_trajectory_path: ""
  mapping_trajectory_max_time_gap_s: 0.20

  # 相对轨迹的铁路走廊 ROI；左侧为正 Y。
  use_roi: True
  roi_y_min_m: -10.0
  roi_y_max_m: 10.0
  roi_z_min_m: -5.0
  roi_z_max_m: 10.0

  # 二维栅格粗提取与垂直高度层连续性。
  grid_resolution_m: 0.5
  min_points_per_cell: 60
  min_height_span_m: 8.0
  layer_resolution_m: 0.2
  min_continuous_layers: 40
  max_component_cells: 8

  # 欧式聚类和支柱形状过滤。
  cluster_tolerance_m: 1.0
  max_xy_span_m: 1.0
  min_cluster_points: 50
  max_cluster_points: 5000

  # SE-LIO 思路的柱轴与截面圆拟合（仅处理已通过粗筛的候选聚类）。
  cylinder_fit_enable: True
  cylinder_ransac_iterations: 128
  cylinder_inlier_threshold_m: 0.10
  cylinder_min_inlier_ratio: 0.35
  cylinder_max_rms_m: 0.20
  cylinder_min_radius_m: 0.08
  cylinder_max_radius_m: 0.80
  cylinder_max_axis_tilt_deg: 5.0
  cylinder_min_angular_coverage: 0.25
  # 铁路支柱通常为刚体直柱，默认不递归分段；弯曲目标可设为 1。
  cylinder_max_piecewise_depth: 0
  cylinder_min_segment_points: 80

  # 拟合柱轴与该基准高程平面的交点作为支柱坐标。
  center_z_offset_m: -5.0

  # 同一支柱按位置、柱轴方向和半径联合合并。
  landmark_merge_radius_m: 1.0
  landmark_max_axis_angle_deg: 5.0
  landmark_max_radius_difference_m: 0.30
  output_directory: "/home/zsq/slam/bievr-slam/src/BIEVR-LIO/Log/poles"
  save_keyframe_clouds: True # 结束时将所有关键帧提取的支柱点汇总保存到 poles.pcd

  # 二次运行时加载首次保存的支柱地图，优化 T_map_odom 的 x/y/yaw。
  # 建图和稠密定位时保持 False；params_pole_localization.yaml 会覆盖开启。
  localization_enable: False
  localization_map_path: "/home/zsq/slam/bievr-slam/src/BIEVR-LIO/Log/poles/landmarks.txt"
  localization_map_frame: "map"
  localization_window_keyframes: 7
  localization_match_distance_m: 4.0
  # 回程可能位于邻近股道：在普通 ±10m ROI 外，保留预测先验柱轴附近的点。
  # 仅定位时生效；柱体检测、最少匹配数和验收门限不变。
  localization_guided_roi: True
  localization_guided_roi_radius_m: 5.0
  localization_guided_roi_max_range_m: 40.0
  localization_radius_difference_m: 0.30
  localization_axis_angle_deg: 5.0
  localization_min_matches: 3 # 数学下限；同时要求 60% 匹配率和 10m 基线
  localization_min_match_ratio: 0.60
  localization_min_baseline_m: 10.0
  localization_max_rms_m: 0.50
  localization_huber_delta_m: 0.50
  localization_max_translation_step_m: 5.0
  localization_max_yaw_step_deg: 5.0
  # 正常使用 /initialpose、GNSS 或已知起点提供初值。仅当两次 odom 确定
  # 共原点时才启用下面的手工初值。
  localization_use_initial_guess: False
  localization_initial_translation: [0.0, 0.0, 0.0]
  # 可选完整姿态 [qx,qy,qz,qw]；存在时优先于 yaw。坡道或中途启动时建议填写。
  localization_initial_orientation_xyzw: []
  localization_initial_yaw_deg: 0.0

# 纯“LIO + 支柱地图”定位输出层；与稠密点云 localization 严格互斥。
pole_localization:
  enable: False
  map_frame: "map"
  output_directory: "/home/zsq/slam/bievr-slam/src/BIEVR-LIO/Log/pole_localization"

  # 递推协方差层负责创新门控；通过门控的观测进入下方 GTSAM 因子图。
  # 测量噪声根据匹配 RMS、匹配数量和空间基线自适应调整。
  filter_enable: True
  # GTSAM Pose3 因子图：每个支柱/轨道提取关键帧建立 X(k)，相邻节点由 LIO
  # BetweenFactor 连接；支柱只约束 x/y/yaw，轨道只约束 z/roll/pitch。
  factor_graph_enable: True
  factor_graph_huber_delta: 2.5
  factor_graph_prior_translation_sigma_m: 0.50
  factor_graph_prior_rotation_sigma_deg: 2.0
  process_noise_xy_m_per_sqrt_m: 0.05
  process_noise_yaw_deg_per_sqrt_m: 0.03
  process_noise_z_m_per_sqrt_m: 0.05
  process_noise_tilt_deg_per_sqrt_m: 0.03
  measurement_xy_floor_m: 0.08
  measurement_yaw_floor_deg: 0.05
  # 这里描述跨关键帧重复提取精度，不是单段曲线内部的厘米级拟合残差。
  measurement_z_floor_m: 0.08
  measurement_tilt_floor_deg: 0.10
  mahalanobis_gate: 36.0
  max_innovation_translation_m: 5.0
  # Railway poles are periodic: the bag1--bag3 online replay produced a
  # geometrically tight three-pole alias with a 1.229 deg yaw jump, while the
  # preceding valid filtered updates stayed below 0.201 deg.
  max_innovation_yaw_deg: 0.5
  # 该数据中非刚性的 map<-odom 高程修正相邻关键帧可变化约 2~5m；候选进入
  # 此处前已经通过轨距、切向、基线和竖直 RMS 检验，因此使用独立的宽门限。
  max_innovation_z_m: 5.0
  max_innovation_tilt_deg: 2.0
  rail_mahalanobis_gate: 144.0
  # 超过该里程没有通过轨道约束时，下一次高质量轨道拟合重新初始化
  # z/roll/pitch，避免长无轨区后的累计高程差被小创新门限永久拒绝。
  rail_rebootstrap_gap_m: 100.0

  # 首次和丢失恢复都要求连续多个窗口确认；长距离没有新支柱时仅改变状态，
  # 仍保留最后修正并由 LIO 连续推算，不向 LIO 前端反馈跳变。
  initial_confirmations: 2
  recovery_confirmations: 2
  degraded_after_distance_m: 90.0
  lost_after_distance_m: 240.0

  publish_path: True
  path_publish_frequency: 2.0
  path_max_poses: 0
  prelocalization_buffer_frames: 5000 # 离线快速回放时按确认时间戳回填轨迹

# 与支柱共用同一批关键帧的左右钢轨矢量提取。建图时保存稀疏三维折线；
# 支柱地图定位时加载该文件，只补充 z/roll/pitch，不加载稠密点云。
rail_extraction:
  enable: True
  # rails.pcd 保留原始分辨率的实测钢轨点；相对轨顶的筛选范围。
  cloud_half_width_m: 0.10
  cloud_depth_m: 0.18
  cloud_above_m: 0.05
  station_resolution_m: 0.40
  lateral_resolution_m: 0.05
  lateral_min_m: -3.0
  lateral_max_m: 3.0
  relative_z_min_m: -5.30
  relative_z_max_m: -3.40
  nominal_gauge_m: 1.435
  min_gauge_m: 1.20
  max_gauge_m: 1.80
  # 输入已经按 0.1m 体素降采样，细横断面内 1 个体素即有效；后续仍由
  # 轨距、双轨显著性、连续性和最短段长度共同验收。
  min_cell_points: 1
  min_prominence_m: 0.035
  max_lateral_jump_m: 0.30
  max_vertical_jump_m: 0.15
  max_cross_level_m: 0.20
  min_segment_samples: 12
  map_path: "/home/zsq/slam/bievr-slam/src/BIEVR-LIO/Log/poles/rail_vector_map.txt"
  match_distance_m: 2.0
  max_tangent_angle_deg: 12.0
  min_matches: 10
  min_baseline_m: 8.0
  huber_delta_m: 0.08
  max_rms_m: 0.12
  # 轨道平面约束只使用横轨方向和 yaw；沿轨平移始终不进入残差。
  max_planar_rms_m: 0.30
  max_cross_track_step_m: 1.0
  max_yaw_step_deg: 2.0
  max_z_step_m: 1.0
  max_tilt_step_deg: 2.0
  # 左右轨顶高差约束横滚，沿线坡度约束俯仰；均不引入沿轨方向平移约束。
  update_roll: True
  update_pitch: True

loop_closure: # 位于里程计后端的 Scan Context + GTSAM 位姿图回环模块
  enable: False # 建图时设为 True；纯里程计或定位时设为 False

  # 关键帧密度：数值越小越容易检测回环，但会增加 CPU 和内存占用
  keyframe_meter_gap: 1.0

  # Scan Context：以下参数与传感器高度和环境尺度有关
  sc_max_radius: 80.0 # 室外建议 80，室内建议 20～40
  sc_lidar_height: 2.0
  sc_num_exclude_recent: 30
  sc_dist_threshold: 0.5 # 出现误回环时应减小此值

  # Scan Context 找到候选位置后，使用一次 small_gicp 进行精配准
  history_keyframe_search_num: 25
  icp_max_correspondence_distance: 5.0
  loop_fitness_score_threshold: 0.2
  # 经常反向经过同一地点时可启用 Scan Context 航向初值
  use_sc_yaw_guess: False

  # GTSAM 因子方差：对回环约束修正 LIO 轨迹的强度影响最大
  odom_noise_rotation: 1.0e-6
  odom_noise_translation: 1.0e-4
  loop_noise_score: 0.5
  loop_noise_cauchy_c: 1.0

  # 地图包包含点云、优化后位姿和 Scan Context 数据库
  bundle_path: "/home/zsq/slam/bievr-slam/src/BIEVR-LIO/Log/bievr_map_bundle"

localization: # 位于里程计后端的先验地图定位模块
  enable: False # 定位时设为 True，同时确保 loop_closure.enable 为 False

  # 地图包支持自动重定位；单独的 PCD 地图需要通过 /initialpose 提供初始位姿
  map_path: "/home/zsq/slam/bievr-slam/src/BIEVR-LIO/Log/bievr_map_bundle"

  # 地图/扫描密度和驻留地图半径主要决定定位精度与内存占用
  map_voxel_size_m: 0.3
  scan_voxel_size_m: 0.5
  crop_radius_m: 150.0
  correction_frequency: 1.0 # 两次定位修正之间由 LIO 连续推算位姿

  # 单次 small_gicp 的验收阈值和安全限制
  icp_max_correspondence_distance: 1.0
  fitness_threshold: 0.3 # 对应点欧氏距离平方的均值 [m²]
  gicp_max_translation_step_m: 3.0
  gicp_max_rotation_step_deg: 15.0

  # 重定位描述子阈值；数值越小，候选匹配越严格
  sc_dist_threshold: 0.2

debug:
  publish_all_clouds: False # 是否发布所有点云（精细、粗略、去畸变）
  timing: False
  log: False
  dashboard: False # 是否实时显示位置、零偏、耗时等状态
  dashboard_ascii_path: "" # 留空时使用配置文件旁的 bievr_ascii.txt
  trajectory_path: "" # 最终 TUM 轨迹自动保存为 Log/odometry_tum.txt；此项留空避免重复写入

max_num_threads: 0 # 0 表示自动选择，正数表示限制并行线程数
